<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Checkout</title>
  </head>
  <body>
    <h1>Subscribe</h1>
    <p>Enter your email and click subscribe (test mode).</p>
    <input id="email" type="email" placeholder="you@example.com" />
    <input id="price" type="text" placeholder="price_..." />
    <button id="checkout">Checkout</button>
    <script>
      document.getElementById('checkout').addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        const price = document.getElementById('price').value;
        const res = await fetch('/billing/create-checkout-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ price_id: price, customer_email: email })
        });
        const data = await res.json();
        if (data.url) {
          window.location = data.url;
        } else {
          alert('Failed to create session');
          console.log(data);
        }
      });
    </script>
  </body>
</html>

[package]
name = "emvproject"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[dependencies]

# Web API
axum = "0.6"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.4", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "5"
tracing-subscriber = "0.3"
redis = { version = "0.25", features = ["tokio-comp"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "any", "postgres", "sqlite", "macros", "migrate"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["alloc", "serde"] }

# Cryptography for zero-knowledge vault
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1.7", features = ["alloc"] }
base64 = "0.21"

[profile.release]
opt-level = 3
lto = true

